name: ci

on:
  push:
    branches:
      - main
      - feature/lab3
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  vet:
    name: vet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: app/go.mod

      - name: Download modules
        working-directory: app
        run: go mod download

      - name: Vet
        working-directory: app
        run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: app/go.mod

      - name: Download modules
        working-directory: app
        run: go mod download

      - name: Test with the race detector
        working-directory: app
        run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: app/go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.5.0
          working-directory: app
          args: --timeout=5m
          skip-cache: false

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - vet
      - test
      - lint
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI unit to pass
        run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
