name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  vet:
    name: Vet
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026e933b2bd36f8a2c8c  # v5.0.2
        with:
          go-version: "1.23"

      - name: Run go vet
        working-directory: ./app
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026e933b2bd36f8a2c8c  # v5.0.2
        with:
          go-version: "1.23"

      - name: Run tests
        working-directory: ./app
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026e933b2bd36f8a2c8c  # v5.0.2
        with:
          go-version: "1.23"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9  # v6.1.1
        with:
          version: v2.5.0
          working-directory: app