name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Cheap gate: decide whether anything worth building actually changed.
  #
  # The obvious approach is a trigger-level `paths:` filter, but that cannot be
  # combined with a *required* aggregated check: on a docs-only PR the whole
  # workflow never starts, `ci-ok` never reports, and branch protection blocks
  # the PR forever at "Expected — waiting for status". Adding a second workflow
  # on the inverse `paths-ignore` does not fix it either, because `paths` and
  # `paths-ignore` are not strict complements — a PR touching docs *and* app
  # code matches both, and `ci-ok` then reports twice with conflicting results.
  # Filtering inside the workflow keeps exactly one authoritative `ci-ok`.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit; running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(app/|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping vet, test and lint."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  vet:
    name: vet
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23', '1.24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: ${{ matrix.go }}
      - name: go vet
        working-directory: app
        run: go vet ./...

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23', '1.24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: ${{ matrix.go }}
      - name: go test
        working-directory: app
        run: go test -race -count=1 ./...

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.24'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893  # v9.3.0
        with:
          version: v2.5.0
          working-directory: app

  # The single required check. Because the matrix names its checks
  # `vet (1.23)` / `vet (1.24)`, requiring the jobs directly would mean editing
  # branch protection every time the matrix changes. `if: always()` is essential:
  # without it a failed dependency would *skip* this job, and a skipped required
  # check can let a broken PR through.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, vet, test, lint]
    runs-on: ubuntu-24.04
    steps:
      - name: verify no upstream job failed
        run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
