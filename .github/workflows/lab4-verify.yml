name: lab4-verify

on:
  push:
    branches:
      - feature/lab4
    paths:
      - "app/**"
      - "lab4/**"
      - ".github/workflows/lab4-verify.yml"

permissions:
  contents: write

jobs:
  trace-and-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: false

      - name: Install packet and network tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes dnsutils iproute2 iptables mtr-tiny tcpdump tshark

      - name: Capture and diagnose QuickNotes
        run: bash lab4/run-linux.sh

      - name: Publish generated evidence to a temporary branch
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --force lab4/*.pcap lab4/*.txt
          git commit -m "test(lab4): publish generated trace evidence"
          git push --force origin HEAD:refs/heads/automation/lab4-results
