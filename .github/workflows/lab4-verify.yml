name: lab4-verify

on:
  push:
    branches:
      - feature/lab4
    paths:
      - "app/**"
      - "lab4/**"
      - ".github/workflows/lab4-verify.yml"

permissions:
  contents: read

jobs:
  trace-and-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: false

      - name: Install packet and network tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes dnsutils iproute2 iptables mtr-tiny tcpdump tshark

      - name: Capture and diagnose QuickNotes
        run: bash lab4/run-linux.sh
