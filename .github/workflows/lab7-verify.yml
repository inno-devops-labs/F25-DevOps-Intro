name: lab7-verify

on:
  push:
    branches:
      - feature/lab7
    paths:
      - "ansible/**"
      - "app/**"
      - "lab7/**"
      - ".github/workflows/lab7-verify.yml"

permissions:
  contents: read

jobs:
  ansible-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANSIBLE_NOCOLOR: "1"
      ANSIBLE_HOST_KEY_CHECKING: "False"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.13"
          cache-dependency-path: app/go.mod

      - name: Install Ansible 10
        run: |
          python3 -m venv /tmp/ansible-lab7
          /tmp/ansible-lab7/bin/pip install \
            ansible==10.7.0 \
            ansible-lint==24.12.2
          /tmp/ansible-lab7/bin/ansible --version

      - name: Build Linux binary and verify playbook syntax
        shell: bash
        run: |
          set -euo pipefail
          bash ansible/build-binary.sh
          file ansible/files/quicknotes | grep --quiet 'ELF 64-bit'
          go version -m ansible/files/quicknotes | grep --quiet 'GOOS=linux'
          /tmp/ansible-lab7/bin/ansible-playbook \
            --inventory lab7/ci-inventory.ini \
            ansible/playbook.yaml \
            --syntax-check

      - name: Lint playbook
        run: |
          /tmp/ansible-lab7/bin/ansible-lint ansible/playbook.yaml

      - name: Prove deployment and idempotency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lab7
          : >lab7/evidence.txt

          echo '=== FIRST RUN ===' | tee -a lab7/evidence.txt
          /tmp/ansible-lab7/bin/ansible-playbook \
            --inventory lab7/ci-inventory.ini \
            ansible/playbook.yaml | tee -a lab7/evidence.txt

          {
            echo '=== SERVICE RESPONSES ==='
            curl --fail --silent http://127.0.0.1:8080/health
            echo
            curl --fail --silent http://127.0.0.1:8080/notes
            echo
          } | tee -a lab7/evidence.txt

          echo '=== SECOND RUN ===' | tee -a lab7/evidence.txt
          /tmp/ansible-lab7/bin/ansible-playbook \
            --inventory lab7/ci-inventory.ini \
            ansible/playbook.yaml | tee -a lab7/evidence.txt
          grep --extended-regexp --quiet \
            'changed=0 +unreachable=0 +failed=0' \
            lab7/evidence.txt

          echo '=== SELECTIVE VARIABLE CHANGE ===' | tee -a lab7/evidence.txt
          /tmp/ansible-lab7/bin/ansible-playbook \
            --inventory lab7/ci-inventory.ini \
            ansible/playbook.yaml \
            --extra-vars '{"quicknotes_addr":":18081"}' \
            | tee -a lab7/evidence.txt
          grep --quiet 'RUNNING HANDLER.*Restart QuickNotes' lab7/evidence.txt
          curl --fail --silent http://127.0.0.1:18081/health \
            | tee -a lab7/evidence.txt
          echo | tee -a lab7/evidence.txt

          echo '=== CHECK DIFF ===' | tee -a lab7/evidence.txt
          /tmp/ansible-lab7/bin/ansible-playbook \
            --inventory lab7/ci-inventory.ini \
            ansible/playbook.yaml \
            --extra-vars '{"quicknotes_addr":":18082"}' \
            --check \
            --diff | tee -a lab7/evidence.txt
