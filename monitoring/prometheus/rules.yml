groups:
  - name: quicknotes-slo
    interval: 15s
    rules:
      - alert: QuickNotesHighErrorRate
        expr: |
          sum(rate(quicknotes_http_responses_by_code_total{code=~"4..|5.."}[1m]))
          /
          clamp_min(rate(quicknotes_http_requests_total[1m]), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: QuickNotes error ratio is above 5%
          description: More than 5% of observed requests have failed for five minutes.
          runbook: docs/runbook/high-error-rate.md
