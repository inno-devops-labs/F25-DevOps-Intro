---
- name: Deploy QuickNotes
  hosts: quicknotes
  become: true
  gather_facts: false

  vars:
    quicknotes_user: quicknotes
    quicknotes_group: quicknotes
    quicknotes_data_dir: /var/lib/quicknotes
    quicknotes_addr: ":8080"
    quicknotes_data_path: /var/lib/quicknotes/notes.json
    quicknotes_seed_path: /var/lib/quicknotes/seed.json
    enable_ansible_pull: false
    quicknotes_repo_url: https://github.com/Mimir-sma/DevOps-Intro.git
    quicknotes_repo_branch: feature/lab7

  tasks:
    - name: Create QuickNotes system group
      ansible.builtin.group:
        name: "{{ quicknotes_group }}"
        system: true

    - name: Create QuickNotes system account
      ansible.builtin.user:
        name: "{{ quicknotes_user }}"
        group: "{{ quicknotes_group }}"
        system: true
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin

    - name: Create QuickNotes data directory
      ansible.builtin.file:
        path: "{{ quicknotes_data_dir }}"
        state: directory
        owner: "{{ quicknotes_user }}"
        group: "{{ quicknotes_group }}"
        mode: "0750"

    - name: Install QuickNotes binary
      ansible.builtin.copy:
        src: files/quicknotes
        dest: /usr/local/bin/quicknotes
        owner: root
        group: root
        mode: "0755"
      notify: Restart QuickNotes

    - name: Install seed data
      ansible.builtin.copy:
        src: files/seed.json
        dest: "{{ quicknotes_seed_path }}"
        owner: "{{ quicknotes_user }}"
        group: "{{ quicknotes_group }}"
        mode: "0640"

    - name: Install QuickNotes systemd unit
      ansible.builtin.template:
        src: templates/quicknotes.service.j2
        dest: /etc/systemd/system/quicknotes.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart QuickNotes

    - name: Enable and start QuickNotes
      ansible.builtin.systemd_service:
        name: quicknotes.service
        daemon_reload: true
        enabled: true
        state: started

    - name: Configure optional ansible-pull loop
      when: enable_ansible_pull | bool
      block:
        - name: Install pull-mode dependencies
          ansible.builtin.apt:
            name:
              - ansible
              - git
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create local Ansible configuration directory
          ansible.builtin.file:
            path: /etc/ansible
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Install pull-mode local inventory
          ansible.builtin.copy:
            src: files/pull-inventory.ini
            dest: /etc/ansible/quicknotes-pull.ini
            owner: root
            group: root
            mode: "0644"

        - name: Install ansible-pull service
          ansible.builtin.template:
            src: templates/ansible-pull.service.j2
            dest: /etc/systemd/system/ansible-pull.service
            owner: root
            group: root
            mode: "0644"
          notify: Restart ansible-pull timer

        - name: Install ansible-pull timer
          ansible.builtin.template:
            src: templates/ansible-pull.timer.j2
            dest: /etc/systemd/system/ansible-pull.timer
            owner: root
            group: root
            mode: "0644"
          notify: Restart ansible-pull timer

        - name: Enable and start ansible-pull timer
          ansible.builtin.systemd_service:
            name: ansible-pull.timer
            daemon_reload: true
            enabled: true
            state: started

  handlers:
    - name: Restart QuickNotes
      ansible.builtin.systemd_service:
        name: quicknotes.service
        daemon_reload: true
        state: restarted

    - name: Restart ansible-pull timer
      ansible.builtin.systemd_service:
        name: ansible-pull.timer
        daemon_reload: true
        enabled: true
        state: restarted
