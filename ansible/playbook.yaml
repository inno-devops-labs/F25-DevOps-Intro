---
- name: Deploy QuickNotes to the Lab 5 VM
  hosts: quicknotes
  become: true
  gather_facts: false
  vars:
    qn_user: quicknotes
    qn_data_dir: /var/lib/quicknotes
    qn_binary: /usr/local/bin/quicknotes
    listen_addr: ":8080"
    data_path: "{{ qn_data_dir }}/notes.json"
    seed_path: "{{ qn_data_dir }}/seed.json"
  tasks:
    - name: Create the quicknotes system user
      ansible.builtin.user:
        name: "{{ qn_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
    - name: Ensure the data directory exists
      ansible.builtin.file:
        path: "{{ qn_data_dir }}"
        state: directory
        owner: "{{ qn_user }}"
        group: "{{ qn_user }}"
        mode: "0750"
    - name: Copy the QuickNotes binary
      ansible.builtin.copy:
        src: files/quicknotes
        dest: "{{ qn_binary }}"
        mode: "0755"
        owner: root
        group: root
      notify: restart quicknotes
    - name: Copy the seed file
      ansible.builtin.copy:
        src: ../app/seed.json
        dest: "{{ seed_path }}"
        owner: "{{ qn_user }}"
        group: "{{ qn_user }}"
        mode: "0640"
    - name: Render the systemd unit
      ansible.builtin.template:
        src: quicknotes.service.j2
        dest: /etc/systemd/system/quicknotes.service
        owner: root
        group: root
        mode: "0644"
      notify: restart quicknotes
    - name: Enable and start the service
      ansible.builtin.systemd_service:
        name: quicknotes
        enabled: true
        state: started
        daemon_reload: true
  handlers:
    - name: restart quicknotes
      ansible.builtin.systemd_service:
        name: quicknotes
        state: restarted
        daemon_reload: true
